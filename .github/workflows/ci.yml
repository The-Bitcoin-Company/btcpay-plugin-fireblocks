name: Build, test and package

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# PR builds (including forks) need only source read access; no secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway through publication.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Read pinned host revision
        id: host
        run: echo "revision=$(git -C submodules/btcpayserver rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Cache only NuGet downloads, never executable build output. The exact
      # source pin, SDK and all project dependency declarations key the cache.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '.gitmodules', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config') }}-${{ steps.host.outputs.revision }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build, test and package
        id: package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: bash scripts/ci.sh
      - name: Upload installable plugin, metadata and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fireblocks-plugin
          # Use the exact version directory as root: no version folder in the
          # downloaded artifact, matching the release job's package/SHA256SUMS.
          path: ${{ steps.package.outputs.directory }}/
          if-no-files-found: error
          retention-days: 14
      # Exercise the same upload/download layout on PRs as the release job uses.
      - name: Download plugin for artifact contract check
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fireblocks-plugin
          path: artifacts/download
      - name: Verify downloaded artifact root and checksums
        working-directory: artifacts/download
        run: sha256sum --check SHA256SUMS
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          retention-days: 14

  nix-flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The flake fetches its independently pinned BTCPay source input.
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Check flake and build plugin package
        run: nix flake check --print-build-logs

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only the tag-only publication job can write releases. It does not execute
    # repository code; PRs and the build job never receive a write token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fireblocks-plugin
          path: package
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd package
          sha256sum --check SHA256SUMS
          # Reruns update assets rather than failing on an existing release.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.btcpay ./*.btcpay.json SHA256SUMS --clobber
